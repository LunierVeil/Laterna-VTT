name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:
    inputs:
      ref:
        description: Commit or ref to resolve once before all checks
        type: string
        required: false
    outputs:
      tested_sha:
        description: Exact commit that passed every required check
        value: ${{ jobs.required.outputs.tested_sha }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  backend:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: python -m pip install -r server/requirements.txt
      - name: Migration snapshot safety tests
        run: python -m unittest discover -s scripts/tests -v
      - name: All backend tests, including SQLite upgrades
        run: python -m pytest server/tests -q --junitxml=artifacts/backend.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: backend-diagnostics
          path: artifacts/

  frontend:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  browser:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: |
          python -m venv server/.venv
          server/.venv/bin/python -m pip install -r server/requirements.txt
      - run: npm ci
        working-directory: web
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: web
      - name: All Chromium scenarios and isolated smoke-test
        env:
          BROWSER_RESULTS_DIR: ${{ github.workspace }}/artifacts/browser
        working-directory: web
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$BROWSER_RESULTS_DIR"
          npm run test:browser 2>&1 | tee "$BROWSER_RESULTS_DIR/runner.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: chromium-diagnostics
          path: artifacts/browser/
          if-no-files-found: warn

  required:
    name: CI required
    needs: [resolve, backend, frontend, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tested_sha: ${{ needs.resolve.outputs.sha }}
    steps:
      - name: Require every check
        env:
          RESOLVE: ${{ needs.resolve.result }}
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          test "$RESOLVE" = success
          test "$BACKEND" = success
          test "$FRONTEND" = success
          test "$BROWSER" = success
